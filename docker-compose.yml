# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.my
    image: new-api:local
    restart: always
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    #command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - new_api_data:/data
    env_file:
      - ./.env.template
    environment:
      - SQL_DSN=postgresql://root:${DB_PASSWORD:-123456}@postgres:5432/new-api # ⚠️ IMPORTANT: Change the password in production!
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-123456}@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      - CRYPTO_SECRET=${CRYPTO_SECRET:-random_crypto_secret}
      - SESSION_SECRET=${SESSION_SECRET:-random_session_secret}  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:8-alpine
    restart: always
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # REDISCLI_AUTH is used by redis-cli for authentication (safer than -a flag)
      - REDISCLI_AUTH=${REDIS_PASSWORD:-123456}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]  # ⚠️ IMPORTANT: Change this password in production!
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - new-api-network

  postgres:
    image: postgres:18-alpine
    restart: always
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      # postgres:18-alpine 默认 PGDATA=/var/lib/postgresql/18/docker（位于镜像声明的匿名卷 /var/lib/postgresql 内）。
      # 若不显式设置 PGDATA，则即使挂载了 postgres_data 到 /var/lib/postgresql/data，数据也不会落盘到该命名卷，
      # docker compose down/up 后会触发 initdb 重新初始化，导致用户/密码等数据丢失。
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: new-api
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

volumes:
  new_api_data:
  pg_data:

networks:
  new-api-network:
    driver: bridge
